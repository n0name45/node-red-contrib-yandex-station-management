<script type="text/javascript">
    
    RED.nodes.registerType('alice-local-in',{
        category: 'Yandex Station',
        color: '#b89fcc',
        defaults: {
            name:{value: ""},
            token: {
                type: "yandex-login",
                required: true
            },
            station_id: {
                required: true
            },
            uniqueFlag: {
                value: false
            },
            debugFlag: {
                value: false
            },
            output: {
                required: true
            },
            homekitFormat: {
                value: "speaker"
            }
        },
        inputs:0,
        outputs:1,
        icon: "station.png",
        label: function() {
            return this.name||this.station_id;
        },
        paletteLabel: "Yandex IN",
        oneditprepare: onOpen
    });

    function onOpen() {
                let config = RED.nodes.node($('#node-input-token').val());
                let selector = $('#node-input-station_id');
                selector.empty();
                let currentId = this.station_id;
                $.getJSON('yandexdevices_'+config.id,function(data) {
                        data.devices.forEach(device => {
                            selector.append(`<option value="${device.id}"> 
                                       ${device.name} (${device.id})
                                  </option>`)
                        $(`#node-input-station_id :contains(${currentId})`).attr("selected", "selected"); 
                    });
                });
                $('#node-input-output').on('change', function(type, value) {
                    if ($(this).val() == 'homekit') {
                        $('#node-unique').show();
                        $('#node-homekitFormat').show();
                    } else {
                        $('#node-unique').hide();
                        $('#node-homekitFormat').hide();
                    }
                });
            }  
</script>

<script type="text/html" data-template-name="alice-local-in">
    <style>
        .label-long {min-width: 150px;width: 20%;}
        .online {display: inline-block; width: auto; vertical-align: middle;}
                /* msg.*-под-подпись — под основной надписью, не растягивает label (основная
           надпись центрируется по строке штатно) */
        .form-horizontal label{position: relative;}
        .form-horizontal label > div.red-ui-debug-msg-type-string{
            position: absolute; left: 0; top: 100%; margin: 0;
        }
    </style> 


    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-bookmark"></i>&nbsp;<span>Name</span></label>
        <input type="text" id="node-input-name" placeholder="">
    </div>
    <div class="form-row">
        <label for="node-input-token"><i class="fa fa-globe"></i>&nbsp;<span>Login</span></label>
        <input type="text" id="node-input-token" placeholder="Token">
    </div>
    <div class="form-row">
        <label for="node-input-station_id" style="padding-top: 7px;"><i class="fa fa-database"></i>&nbsp;<span>Station</span></label>
        <div style="display: inline-block;position: relative;width: 70%;height: 34px;vertical-align: top;">
            <div style="position: absolute;left: 0px; right: 40px;">
                <select id="node-input-station_id" data-single="true" style="width: 100%"></select>
            </div>        
            <div style="text-align: end; display: inline; float: right">
                <button onclick="onOpen()" class="red-ui-button" style="position: absolute;right: 0px;top: 0px;"><i class="fa fa-refresh"></i></button>
            </div>
        </div>
    </div>
    <div class="form-row">
        <label for="node-input-output" style="padding-top: 7px;"><i class="fa fa-arrow-circle-o-left"></i>&nbsp;<span>Output</span></label>
        <div style="display: inline-block;position: relative;width: 70%;height: 34px;vertical-align: top;">
            <div style="position: absolute;left: 0px; right: 0px;">
                <select id="node-input-output" data-single="true" style="width: 100%">
                    <option value="status">Full status Message</option>
                    <option value="homekit">HomeKit formatted</option>
                </select>
            </div>
        </div>
    </div>
    <div class="form-row" id="node-homekitFormat">
        <label for="node-input-homekitFormat" style="padding-top: 7px;"><i class="fa fa-arrow-circle-o-left"></i>&nbsp;<span>Homekit</span></label>
        <div style="display: inline-block;position: relative;width: 70%;height: 34px;vertical-align: top;">
            <div style="position: absolute;left: 0px; right: 0px;">
                <select id="node-input-homekitFormat" data-single="true" style="width: 100%">
                    <option value="speaker">Smart Speaker</option>
                    <option value="tv">Television</option>
                </select>
            </div>
        </div>
    </div>
    <div class="form-row" id="node-unique">
        <label for='node-input-uniqueFlag' class="label-long"><i class='fa fa-first-order'></i>&nbsp;<span>Unique messages</span></label>
        <input type="checkbox" id="node-input-uniqueFlag" checked="checked" style="display: inline-block; width: auto; vertical-align: middle;"> 
    </div>
    <div class="form-row">
        <label for='node-input-debugFlag' class="label-long"><i class='fa fa-share-square'></i>&nbsp;<span>Debug</span></label>
        <input type="checkbox" id="node-input-debugFlag" checked="checked" style="display: inline-block; width: auto; vertical-align: middle;"> 
    </div>
</script>

<script type="text/html" data-help-name="alice-local-in">
    <p> Input node for Yandex Station local management</p>
</script>
