name: Prepare minor release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Create version commit and tag
        id: version
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(npm version minor -m 'Release %s')
          git push --atomic origin HEAD:refs/heads/master "refs/tags/$version"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
      - name: Start npm publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run publish.yml --ref "$RELEASE_TAG"
